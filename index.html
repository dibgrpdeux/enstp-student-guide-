<!-- ===== قسم الترجمة والنبذة ===== -->
<div class="container" id="guide-intro">

  <header>
    <div class="lang-switch">
      <button onclick="setLang('ar')" id="btn-ar" class="active">عربي</button>
      <button onclick="setLang('fr')" id="btn-fr">Français</button>
      <button onclick="setLang('en')" id="btn-en">English</button>
    </div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <section>
    <h2 data-i18n="aboutTitle"></h2>
    <p data-i18n="aboutP1"></p>
    <p data-i18n="aboutP2"></p>
  </section>

  <section>
    <h2 data-i18n="featuresTitle"></h2>
    <ul>
      <li><strong data-i18n="feat1Title"></strong><span data-i18n="feat1Text"></span></li>
      <li><strong data-i18n="feat2Title"></strong><span data-i18n="feat2Text"></span></li>
      <li><strong data-i18n="feat3Title"></strong><span data-i18n="feat3Text"></span></li>
    </ul>
  </section>

  <footer data-i18n="footer"></footer>

</div>

<style>
  #guide-intro * { box-sizing: border-box; }
  #guide-intro {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f4f7fa;
    color: #1f2d3d;
    line-height: 1.8;
    padding: 20px;
    border-radius: 16px;
    max-width: 900px;
    margin: 20px auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  #guide-intro header {
    background: linear-gradient(135deg, #0a4d8c, #1e88e5);
    color: #fff; text-align: center; padding: 40px 20px;
    border-radius: 16px 16px 0 0; position: relative;
  }
  #guide-intro header h1 { font-size: 1.9rem; margin-bottom: 10px; }
  #guide-intro header p  { font-size: 1.05rem; opacity: 0.95; }
  #guide-intro .lang-switch {
    position: absolute; top: 15px; left: 15px;
    display: flex; gap: 6px;
  }
  #guide-intro .lang-switch button {
    background: rgba(255,255,255,0.2); color: #fff;
    border: 1px solid rgba(255,255,255,0.6); border-radius: 8px;
    padding: 5px 10px; font-size: 0.8rem; cursor: pointer;
  }
  #guide-intro .lang-switch button.active {
    background: #fff; color: #0a4d8c; font-weight: bold;
  }
  #guide-intro section { padding: 30px 25px; }
  #guide-intro section h2 {
    color: #0a4d8c; font-size: 1.4rem; margin-bottom: 15px;
    border-right: 5px solid #1e88e5; padding-right: 12px;
  }
  #guide-intro ul { list-style: none; margin-top: 10px; }
  #guide-intro ul li {
    background: #f0f7ff; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px;
    border-right: 4px solid #1e88e5;
  }
  #guide-intro ul li strong { color: #0a4d8c; }
  #guide-intro footer {
    text-align: center; padding: 20px; font-size: 0.9rem;
    color: #6b7c93; background: #f4f7fa; border-radius: 0 0 16px 16px;
  }
</style>

<script>
  const translations = {
    ar: {
      title: "دليل النجاة في ENSTP",
      subtitle: "يومك الأول… في جيبك",
      aboutTitle: "نبذة عن المدرسة",
      aboutP1: "المدرسة الوطنية العليا للأشغال العمومية (ENSTP) مؤسسة تعليم عالي جزائرية عريقة تقع في القبة بالجزائر العاصمة. تأسست سنة 1966، وتُعدّ المورد الرئيسي للمهندسين في قطاع البناء والأشغال العمومية والري في الجزائر.",
      aboutP2: "تخرّج منها أكثر من 6000 مهندس جزائري، إضافة إلى مهندسين من دول إفريقية وعربية. يتميز التكوين فيها بانتقائية عالية، ويمتد على خمس سنوات.",
      featuresTitle: "مميزات هذا الموقع",
      feat1Title: "مساعد ذكي تفاعلي: ",
      feat1Text: "اطرح سؤالك بلغة طبيعية، وسيجيبك الذكاء الاصطناعي اعتماداً على محتوى الدليل.",
      feat2Title: "محتوى عملي وموجّه: ",
      feat2Text: "كل المعلومات التي يحتاجها الطالب الجديد في يومه الأول.",
      feat3Title: "سهل الوصول: ",
      feat3Text: "متاح على الهاتف في أي وقت ومن أي مكان.",
      footer: "دليل النجاة ENSTP — صُنع لمساعدة الطلبة الجدد"
    },
    fr: {
      title: "Guide de survie ENSTP",
      subtitle: "Ton premier jour… dans ta poche",
      aboutTitle: "À propos de l'école",
      aboutP1: "L'École Nationale Supérieure des Travaux Publics (ENSTP) est une prestigieuse institution algérienne située à Kouba, Alger. Fondée en 1966, elle est la principale source d'ingénieurs dans le secteur BTP en Algérie.",
      aboutP2: "Plus de 6000 ingénieurs algériens y ont été diplômés, ainsi que des ingénieurs africains et arabes. La formation est très sélective et s'étend sur cinq ans.",
      featuresTitle: "Les atouts de ce site",
      feat1Title: "Assistant intelligent : ",
      feat1Text: "Posez votre question en langage naturel, l'IA vous répondra.",
      feat2Title: "Contenu pratique : ",
      feat2Text: "Toutes les infos dont un nouvel étudiant a besoin dès son premier jour.",
      feat3Title: "Accessible partout : ",
      feat3Text: "Disponible sur mobile à tout moment.",
      footer: "Guide de survie ENSTP — conçu pour aider les nouveaux étudiants"
    },
    en: {
      title: "ENSTP Survival Guide",
      subtitle: "Your first day… in your pocket",
      aboutTitle: "About the School",
      aboutP1: "The National Higher School of Public Works (ENSTP) is a prestigious Algerian institution located in Kouba, Algiers. Founded in 1966, it is the main source of engineers in the construction sector in Algeria.",
      aboutP2: "More than 6,000 Algerian engineers have graduated from it, along with African and Arab engineers. Training is highly selective and spans five years.",
      featuresTitle: "Features of this Website",
      feat1Title: "Interactive smart assistant: ",
      feat1Text: "Ask your question in natural language, and the AI will answer.",
      feat2Title: "Practical content: ",
      feat2Text: "All the info a new student needs on their first day.",
      feat3Title: "Easy access: ",
      feat3Text: "Available on mobile anytime, anywhere.",
      footer: "ENSTP Survival Guide — made to help new students"
    }
  };

  function setLang(lang) {
    const dir = (lang === "ar") ? "rtl" : "ltr";
    document.documentElement.lang = lang;
    document.documentElement.dir = dir;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });
    ["ar","fr","en"].forEach(l => {
      const b = document.getElementById("btn-" + l);
      if (b) b.classList.toggle("active", l === lang);
    });
    localStorage.setItem("guide-lang", lang);
  }

  const savedLang = localStorage.getItem("guide-lang") || "ar";
  setLang(savedLang);
</script>
<!-- ===== نهاية قسم الترجمة والنبذة ===== -->
