<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription — ENSTP Forum</title>
<style>
:root{--acc:#c2410c;--acc2:#9a3412;--bg:#f6f4ef;--ink:#1d2433;--mut:#667085;--line:#e5e1d8}
*{box-sizing:border-box;margin:0;padding:0}
body{font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.register-container{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo-big{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#fff}
h1{text-align:center;color:var(--ink);font-size:1.5rem;margin-bottom:8px}
.sub{text-align:center;color:var(--mut);margin-bottom:24px;font-size:.9rem}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:8px;color:var(--ink);font-weight:700;font-size:.9rem}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:1rem;background:var(--bg);outline:none;transition:all .2s;font-family:inherit;color:var(--ink)}
.form-group input:focus,.form-group select:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px rgba(194,65,12,.1)}
.form-group small{display:block;margin-top:4px;color:#94a3b8;font-size:.78rem}
.year-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.year-btn{padding:14px 10px;border:2px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;color:var(--mut);transition:all .3s cubic-bezier(.2,.8,.2,1);text-align:center;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:6px}
.year-btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-3px);box-shadow:0 6px 18px rgba(194,65,12,.2)}
.year-btn.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:var(--acc);box-shadow:0 10px 25px rgba(194,65,12,.45);transform:translateY(-3px)}
.year-btn .year-icon{font-size:1.5rem;display:block}
.year-btn.full{grid-column:1/-1}
.year-btn .year-sub{font-size:.7rem;opacity:.7;font-weight:500}
.year-btn.active .year-sub{opacity:.9}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;margin-top:8px;box-shadow:0 8px 20px rgba(194,65,12,.35)}
.btn-submit:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(194,65,12,.55)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error-msg{display:none;background:#fee2e2;color:#991b1b;padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:.9rem;border-left:4px solid #dc2626;white-space:pre-wrap}
.error-msg.show{display:block}
.success-msg{display:none;background:#d1fae5;color:#065f46;padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:.9rem;border-left:4px solid #10b981}
.success-msg.show{display:block}
.login-link{text-align:center;margin-top:20px;font-size:.9rem;color:var(--mut)}
.login-link a{color:var(--acc);font-weight:600;text-decoration:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.register-container{padding:24px 20px;border-radius:20px}.year-btn{padding:12px 8px;font-size:.75rem}.year-btn .year-icon{font-size:1.3rem}}
</style>
</head>
<body>
<div class="register-container">
  <div class="logo-big">👥</div>
  <h1>Inscription</h1>
  <p class="sub">Rejoignez le forum ENSTP avec votre email universitaire</p>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>
  <form id="registerForm">
    <div class="form-group">
      <label for="name">Nom complet *</label>
      <input type="text" id="name" placeholder="Ahmed Ben Ali" required minlength="2">
    </div>
    <div class="form-group">
      <label for="email">Email universitaire *</label>
      <input type="email" id="email" placeholder="prenom.nom@enstp.edu.dz" required>
      <small>⚠️ Uniquement @enstp.edu.dz</small>
    </div>
    <div class="form-group">
      <label for="password">Mot de passe *</label>
      <input type="password" id="password" placeholder="Au moins 6 caractères" required minlength="6">
      <small>Minimum 6 caractères</small>
    </div>
    <div class="form-group">
      <label for="wilaya">Wilaya *</label>
      <select id="wilaya" required><option value="">— Choisir votre wilaya —</option></select>
    </div>
    <div class="form-group">
      <label>Année d'étude *</label>
      <div class="year-options" id="yearOptions">
        <button type="button" class="year-btn" data-year="1acp" onclick="selectYear('1acp')"><span class="year-icon">📘</span><span>1ère année Préparatoire</span><span class="year-sub">Cycle Préparatoire</span></button>
        <button type="button" class="year-btn" data-year="2acp" onclick="selectYear('2acp')"><span class="year-icon">📗</span><span>2ème année Préparatoire</span><span class="year-sub">Cycle Préparatoire</span></button>
        <button type="button" class="year-btn full" data-year="1ing" onclick="selectYear('1ing')"><span class="year-icon">🎓</span><span>1ère année Ingénieur</span><span class="year-sub">Cycle Ingénieur</span></button>
        <button type="button" class="year-btn full" data-year="2ing" onclick="selectYear('2ing')"><span class="year-icon">🎓</span><span>2ème année Ingénieur</span><span class="year-sub">Cycle Ingénieur</span></button>
        <button type="button" class="year-btn full" data-year="3ing" onclick="selectYear('3ing')"><span class="year-icon">🎓</span><span>3ème année Ingénieur</span><span class="year-sub">Cycle Ingénieur</span></button>
      </div>
      <input type="hidden" id="year" required>
    </div>
    <div class="form-group">
      <label for="groupe">Groupe</label>
      <input type="text" id="groupe" placeholder="G1, G2..." maxlength="20">
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Créer mon compte</button>
  </form>
  <div class="login-link">Déjà inscrit ? <a href="login.html">Se connecter</a></div>
</div>
<script type="module">
import { registerUser, onAuthChange } from './auth.js';
import { WILAYAS } from './firebase-config.js';
const wilayaSelect = document.getElementById('wilaya');
WILAYAS.forEach(w => {
  const opt = document.createElement('option');
  opt.value = w; opt.textContent = w;
  wilayaSelect.appendChild(opt);
});
onAuthChange(user => { if (user) window.location.href = 'forum.html'; });
window.selectYear = function(yearId) {
  document.getElementById('year').value = yearId;
  document.querySelectorAll('.year-btn').forEach(b => b.classList.toggle('active', b.dataset.year === yearId));
};
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const submitBtn = document.getElementById('submitBtn');
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const wilaya = document.getElementById('wilaya').value;
  const year = document.getElementById('year').value;
  const groupe = document.getElementById('groupe').value.trim();
  if (!email.toLowerCase().endsWith('@enstp.edu.dz')) {
    errorMsg.textContent = '⚠️ Utilisez uniquement votre email @enstp.edu.dz';
    errorMsg.classList.add('show'); return;
  }
  if (!year) { errorMsg.textContent = '⚠️ Choisissez votre année'; errorMsg.classList.add('show'); return; }
  if (!wilaya) { errorMsg.textContent = '⚠️ Choisissez votre wilaya'; errorMsg.classList.add('show'); return; }
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Création...';
  try {
    await registerUser(email, password, name, wilaya, year, groupe);
    successMsg.textContent = '✅ Compte créé ! Redirection...';
    successMsg.classList.add('show');
    setTimeout(() => { window.location.href = 'forum.html'; }, 1200);
  } catch (err) {
    let msg = '❌ ' + err.message;
    if (err.code === 'auth/email-already-in-use') msg = '❌ Cet email est déjà utilisé';
    else if (err.code === 'auth/invalid-email') msg = '❌ Email invalide';
    else if (err.code === 'auth/weak-password') msg = '❌ Mot de passe trop faible (min 6)';
    else if (err.code === 'auth/network-request-failed') msg = '❌ Erreur réseau';
    errorMsg.textContent = msg; errorMsg.classList.add('show');
    submitBtn.disabled = false; submitBtn.textContent = 'Créer mon compte';
  }
});
</script>
</body>
</html>
