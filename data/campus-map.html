<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة المدرسة التفاعلية</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#14213d;--mut:#5b6785;--ac:#2f4fd1;--bd:#cfd7ec;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#141f45;--tx:#eef1fb;--mut:#9aa7cf;--ac:#7f9bff;--bd:#2b3a6e}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#141f45;--tx:#eef1fb;--mut:#9aa7cf;--ac:#7f9bff;--bd:#2b3a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;line-height:1.6}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.2rem;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:10px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
select,input{flex:1;width:100%}
button{cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#box{position:relative;border:1.5px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card)}
#sc{height:62vh;overflow:auto}
#zm{position:absolute;inset-block-start:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zm button{width:40px;height:40px;padding:0;font-size:1.3rem;line-height:1}
svg{display:block}
.mk{fill:transparent;cursor:pointer}
.mk:hover{stroke:#f08c00;stroke-width:2.5}
.flow{fill:none;stroke:#ffc21a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 13;animation:d 1s linear infinite}
.cas{fill:none;stroke:#1b2a5e;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
@keyframes d{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
#info{margin-top:10px;padding:12px 14px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px}
#info b{color:var(--ac)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hd h1{margin:0;flex:1}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#sd{position:fixed;inset-block:0;inset-inline-start:0;width:min(88vw,340px);background:var(--card);border-inline-end:1.5px solid var(--bd);z-index:9;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sd.o{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--bd)}
#ls{overflow:auto;padding:8px;flex:1}.li{display:flex;gap:6px;margin-bottom:6px}
.it{flex:1;display:flex;gap:10px;align-items:center;text-align:start}.it i{font-style:normal;font-weight:700;color:var(--ac);min-width:1.6em}.li.on .it{border-color:var(--ac)}.me{padding:8px}
</style>
</head>
<body>
<div class="w">
<div class="hd"><h1>خريطة المدرسة</h1><button id="op">☰ الأماكن</button></div>
<label for="st">أنا الآن في</label>
<div class="row"><select id="st"></select></div>
<label for="q">ابحث برقم المكان أو اسمه</label>
<div class="row"><input id="q" placeholder="مثال: 12 أو المكتبة"><button class="p" id="go">ابحث</button></div>
<div id="box">
<div id="zm"><button id="zi" aria-label="تكبير">+</button><button id="zo" aria-label="تصغير">−</button></div>

<div id="info">اختر مكانك الحالي ثم اضغط على رقم المبنى الذي تريده.</div>
<aside id="sd"><div class="sh"><b>الأماكن</b><button id="cl" aria-label="إغلاق">✕</button></div><div id="ls"></div></aside>
</div>
<script>
// أسماء الأماكن: عدّل النص بين علامتي الاقتباس ليطابق مدرستك (الافتراضي «مبنى + الرقم»)
const NAMES={"01":"المدخل ومركز الحراسة","02":"الإدارة العامة","03":"مكتب الضمان الاجتماعي","04":"عيادة المدرسة","05":"فضاء المصالح المشتركة","06":"نادي المدرسة","07":"مدخل الإقامة الجامعية","08":"مطعم الإقامة الجامعية","09":"ملعب المدرسة","10":"مباني الإقامة الجامعية","11":"محطة شحن السيارات الكهربائية","12":"خزان المياه مع نظام مكافحة الحرائق","13":"موقف السيارات 2 للأساتذة والزوار","14":"مولدات كهربائية","15":"المديرية الفرعية للتعليم والشهادات والتكوين المتواصل","16":"ما بعد التدرج + قاعة ومكاتب الأساتذة + مركز الإعلام الآلي","17":"الأقسام التحضيرية","18":"البهو المركزي","19":"المدرج «أ»","20":"قسم الهياكل القاعدية + مخبر علوم الأرض","21":"المدفأة المركزية","22":"مخبر البحث العلمي","23":"المكتبة + قاعة الإعلام الآلي","24":"المخابر + قسم المواد والهياكل + مكتب تثمين","25":"المخابر البيداغوجية + الأرشيف + قاعة الإعلام الآلي","26":"المدرج «ب»","27":"أقسام التدريس · ط1: 20 · ط2: 19","28":"أقسام التدريس · ط1: 7–9 · ط2: 16–18","29":"أقسام التدريس · ط1: 5–6 · ط2: 14–15","30":"أقسام التدريس · ط1: 1–4 · ط2: 10–13","IN":"المدخل الرئيسي","HERE":"أنا هنا (لوحة الخريطة)"};
// مواقع الأماكن على الصورة [رقم، x، y]
const L=[["01",468,933],["02",367,803],["03",339,780],["04",329,811],["05",280,772],["06",257,822],["07",289,861],["08",247,866],["09",322,937],["10",160,793],["11",463,698],["12",523,715],["13",417,671],["14",410,638],["15",350,690],["16",316,637],["17",330,704],["18",262,622],["19",205,688],["20",218,755],["21",140,692],["22",105,597],["23",350,525],["24",135,537],["25",220,490],["26",302,478],["27",375,610],["28",330,570],["29",245,573],["30",170,612],["IN",500,908],["HERE",432,830]];
const P={};L.forEach(([id,x,y])=>P[id]={id,x,y,name:NAMES[id]||"مبنى "+id});
// نقاط الممرات والطرق
let N={"E":[500,908],"A":[438,872],"A2":[450,925],"B":[398,866],"C":[412,820],"D":[415,752],"F":[402,700],"G":[397,664],"H":[352,630],"Q":[315,725],"R":[271,705],"S":[230,719],"U":[270,646],"W":[217,596],"Y":[288,577],"Z":[231,528],"a":[140,575],"b":[278,507],"e1":[465,705],"e2":[525,735],"s1":[336,850],"s2":[298,788],"nc9qn6":[256,582],"ng797q":[190,839],"n4j0rk":[296,750],"nfph3s":[188,631],"nbajil":[279,849],"nyjgwd":[302,654],"nep0s4":[278,803]},E=[["E","A"],["A","A2"],["A","B"],["B","C"],["C","D"],["D","F"],["F","G"],["G","H"],["D","Q"],["Q","R"],["R","S"],["R","U"],["Y","H"],["Z","b"],["Z","a"],["a","W"],["F","e1"],["e1","e2"],["B","s1"],["s1","s2"],["U","Y"],["Y","b"],["U","W"],["W","nc9qn6"],["nc9qn6","Y"],["n4j0rk","s2"],["n4j0rk","R"],["nfph3s","W"],["nbajil","ng797q"],["s1","nbajil"],["nyjgwd","U"],["nep0s4","s2"]];
let G;function build(){G={};Object.keys(N).forEach(k=>G[k]=[]);E=E.filter(([a,b])=>N[a]&&N[b]);E.forEach(([a,b])=>{const d=Math.hypot(N[a][0]-N[b][0],N[a][1]-N[b][1]);G[a].push([b,d]);G[b].push([a,d])})}
const near=p=>Object.keys(N).reduce((m,k)=>Math.hypot(N[k][0]-p.x,N[k][1]-p.y)<Math.hypot(N[m][0]-p.x,N[m][1]-p.y)?k:m);
function dij(s,t){const d={},pr={},q=new Set(Object.keys(N));Object.keys(N).forEach(k=>d[k]=1e9);d[s]=0;
while(q.size){let u=null;q.forEach(k=>{if(u===null||d[k]<d[u])u=k});q.delete(u);if(u===t)break;G[u].forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}})}
const r=[];for(let c=t;c;c=pr[c]){r.unshift(c);if(c===s)break}return r}
const NS="http://www.w3.org/2000/svg",$=i=>document.getElementById(i);
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
let start="HERE",dest=null,z=1.5;
const sel=$("st");
Object.values(P).forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=(+p.id?p.id+" · ":"")+p.name;sel.appendChild(o)});
sel.value=start;
L.forEach(([id,x,y])=>{if(id==="IN"||id==="HERE")return;const c=mk("circle",{cx:x,cy:y,r:15,class:"mk"},$("k"));c.onclick=()=>pick(id);mk("title",{},c).textContent=P[id].name});
function draw(){
const r=$("r");r.innerHTML="";const a=P[start];
if(dest&&dest!==start){const b=P[dest],pts=[[a.x,a.y]];dij(near(a),near(b)).forEach(k=>pts.push(N[k]));pts.push([b.x,b.y]);
const s=pts.map(p=>p.join(",")).join(" ");mk("polyline",{points:s,class:"cas"},r);mk("polyline",{points:s,class:"flow"},r);
mk("circle",{cx:b.x,cy:b.y,r:17,fill:"none",stroke:"#ffc21a","stroke-width":4},r)}
mk("circle",{cx:a.x,cy:a.y,r:10,fill:"#e03131",stroke:"#fff","stroke-width":3},r);
const i=$("info");i.innerHTML=dest&&dest!==start?"من <b>"+a.name+"</b> إلى <b>"+P[dest].name+"</b> — الخط المنقّط الأصفر هو الطريق.":"اختر مكانك الحالي ثم اضغط على رقم المبنى الذي تريده."}
function pick(id){dest=id;draw();lst();sd.classList.remove("o");$("box").scrollIntoView({block:"nearest"})}
sel.onchange=()=>{start=sel.value;draw()};
function find(){const r=lst();if(r.length)return pick(r[0]);const v=$("q").value.trim().padStart(2,"0");if(P[v]&&v!=="IN"&&v!=="HERE")pick(v);else $("info").textContent="لا يوجد مبنى بهذا الرقم. جرّب رقمًا من 1 إلى 30."}
$("go").onclick=find;$("q").onkeydown=e=>{if(e.key==="Enter")find()};
const zoom=()=>{$("m").style.width=Math.round(z*100)+"%"};
$("zi").onclick=()=>{z=Math.min(3.5,z+.5);zoom()};$("zo").onclick=()=>{z=Math.max(1,z-.5);zoom()};
const sd=$("sd");
function lst(){const f=$("q").value.trim(),u=$("ls");u.innerHTML="";return L.filter(([id])=>+id&&(!f||P[id].name.includes(f)||id===f.padStart(2,"0"))).map(([id])=>{const p=P[id],r=document.createElement("div");r.className="li"+(id===dest?" on":"");r.innerHTML="<button class='it'><i>"+id+"</i><span>"+p.name+"</span></button><button class='me' title='أنا هنا'>📍</button>";r.firstChild.onclick=()=>pick(id);r.lastChild.onclick=()=>{start=id;sel.value=id;draw();sd.classList.remove("o")};u.appendChild(r);return id})}
$("op").onclick=()=>{lst();sd.classList.add("o")};$("cl").onclick=()=>sd.classList.remove("o");$("q").oninput=lst;
build();zoom();draw();
</script>
